name: Build and test
on:
  workflow_call:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - bugfix/*
      - feature/*
      - release/*
      - chore/*
      - security/*

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.10"
    - name: Lint
      run: |
        pip install ruff
        ruff check --exclude issues

    - name: Test packaging
      run: |
        pip install pytest setuptools
        python -m pytest tests/packaging

  sdist:
    name: Build sdist wheel
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.10"

    - name: build sdist
      run: |
        make preprocess
        pip install build
        python -m build --sdist
        pip install ./dist/*.tar.gz

    - name: upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: curl_cffi-${{ github.sha }}-sdist.zip
        path: ./dist/*.tar.gz

  bdist:
    name: Build bdist wheels and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          cibw_archs_linux: "x86_64 i686"
        - os: ubuntu-24.04-arm
          cibw_archs_linux: "aarch64"
        - os: ubuntu-24.04
          cibw_archs_linux: "riscv64"
          qemu: true
        - os: ubuntu-24.04
          cibw_archs_linux: "armv7l"
          qemu: true
        - os: macos-15-intel
        - os: macos-14
        - os: windows-2022
        - os: windows-11-arm
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"

    - if: matrix.qemu
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        platforms: all

    # macOS make is too old
    - if: runner.os == 'macOS'
      run: |
        brew install make automake libtool pkg-config

    - name: Build and test wheels
      uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
      env:
        CIBW_ARCHS_LINUX: ${{ matrix.cibw_archs_linux }}

    # - name: Setup tmate session
    #   uses: mxschmitt/action-tmate@v3

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: curl_cffi-${{ github.sha }}-${{ matrix.os }}-${{ strategy.job-index }}.zip
        path: ./wheelhouse/*.whl

  bdist_android:
    name: Build Android wheels
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: 'temurin'
        java-version: '17'

    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: platform-tools

    - name: Build wheels (Android)
      uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
      env:
        CIBW_PLATFORM: android
        # One wheel per CPython minor, see the Android note in setup.py.
        CIBW_BUILD: cp313-android_arm64_v8a cp314-android_arm64_v8a cp315-android_arm64_v8a
        ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        ANDROID_API_LEVEL: 24

    # cibuildwheel silently reuses an abi3 wheel for a later interpreter, so a
    # missing wheel would otherwise leave this job green.
    - name: Check one wheel was built per CPython minor
      run: |
        ls -l ./wheelhouse/
        for tag in cp313 cp314 cp315; do ls ./wheelhouse/*-$tag-*-android_*.whl; done

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: curl_cffi-${{ github.sha }}-android.zip
        path: ./wheelhouse/*.whl

  # Make our build process future-proof
  build_latest:
    name: Build bdist on latest OSes
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # For linux, it's built inside a container, no need to test for latest versions.
        os: [macos-latest, windows-latest, windows-11-arm]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"

    - if: runner.os == 'Linux'
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        platforms: all

    # macOS make is too old
    - if: runner.os == 'macOS'
      run: |
        brew install make automake libtool pkg-config

    - name: Build and test wheels
      uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
