name: Test pro features
on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main
      - bugfix/*
      - feature/*
      - release/*
      - chore/*
    tags:
      - v*

permissions:
  contents: write

env:
  CIBW_TEST_COMMAND: "pytest {project}/tests/pro"
  CIBW_ENVIRONMENT_PASS_LINUX: IMPERSONATE_API_KEY
  IMPERSONATE_API_KEY: ${{ secrets.IMPERSONATE_API_KEY }}

jobs:
  bdist:
    name: Build bdist wheels and test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-14, windows-2022, windows-11-arm]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - if: runner.os == 'Linux'
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        platforms: all

    # macOS make is too old
    - if: runner.os == 'macOS'
      run: |
        brew install make automake libtool

    - name: Build and test wheels
      uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
